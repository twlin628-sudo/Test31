<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>心裡畫</title>
<style>
:root{
  --bg:#1c2028; --panel:#262b36; --line:#3a4150; --text:#e8ebf0; --sub:#9aa3b2;
  --accent:#4fb3a9; --danger:#e06c75;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);overscroll-behavior:none}
body{padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 16px)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-top:10px}
header{display:flex;align-items:baseline;justify-content:space-between}
h1{margin:0;font-size:22px;letter-spacing:.08em}
#ver{color:var(--sub);font-size:12px}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
button,select,input,textarea{font:inherit;color:var(--text)}
button{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer}
button.on{border-color:var(--accent);color:var(--accent)}
button:active{opacity:.7}
input[type=color]{width:40px;height:40px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
input[type=range]{flex:1;min-width:90px;accent-color:var(--accent)}
.size{display:flex;align-items:center;gap:8px;flex:1 1 100%}
.size span{color:var(--sub);font-size:13px;min-width:2.6em;text-align:right}
.swatches{display:flex;gap:6px;flex:1 1 100%}
.swatches i{flex:1;height:26px;border-radius:6px;border:2px solid transparent;cursor:pointer}
.swatches i.on{border-color:var(--text)}
.stage{background:#fff;border-radius:10px;overflow:hidden;line-height:0;border:1px solid var(--line)}
canvas{width:100%;height:auto;aspect-ratio:3/4;touch-action:none;display:block}
label.t{font-size:13px;color:var(--sub)}
.submit{background:var(--accent);border-color:var(--accent);color:#0f1a19;font-weight:700;min-height:48px;font-size:16px}
.submit:disabled{opacity:.5}
.result{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;white-space:pre-wrap;line-height:1.65;min-height:56px;font-size:15px}
.result.err{border-color:var(--danger);color:var(--danger)}
.result:empty::before{content:"鑑賞結果會顯示在這裡";color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>心裡畫</h1><span id="ver"></span></header>
  <div class="tools">
    <button id="bPen" class="on">畫筆</button>
    <button id="bEraser">橡皮擦</button>
    <button id="bUndo">復原</button>
    <button id="bRedo">重做</button>
    <button id="bClear">清空</button>
    <input type="color" id="color" value="#111111" aria-label="自訂顏色">
    <div class="swatches" id="swatches"></div>
    <div class="size"><label class="t" for="size">粗細</label><input type="range" id="size" min="1" max="40" value="6"><span id="sizeV">6</span></div>
  </div>

  <div class="stage"><canvas id="cv" width="900" height="1200"></canvas></div>

  <button id="send" class="submit">請鑑賞</button>
  <div id="out" class="result" aria-live="polite"></div>

</div>

<script>
// ===== 設定 =====
const VERSION = "1.0.0";
const API_URL = "https://patient-wave-276e.twlin628.workers.dev/v1/chat/completions";
const MODEL   = "gemma-4-26b-a4b-it"; // Worker 會強制覆蓋，這裡僅為格式完整
const PROMPT  = "你是一位熱情、眼光獨到的藝評家。請用繁體中文回應這幅手繪作品：先用兩三句話簡短說明你在畫中看到了什麼、可能想表達什麼；接著以吹捧為主軸，盡情誇讚它的藝術性，包含構圖、線條、色彩、意境、創意與獨特風格，可以用誇張又有趣的藝評口吻，把它捧成大師級傑作。只輸出最終評語，不要輸出思考過程。";
// ================

const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d", { willReadFrequently: true });

let tool = "pen", color = "#111111", size = 6, drawing = false, last = null;
let undoStack = [], redoStack = [];
const MAX_HISTORY = 12;

function whiteFill(){ ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height); }
function snapshot(){
  undoStack.push(ctx.getImageData(0, 0, cv.width, cv.height));
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack = [];
}
whiteFill();

// 色票
const palette = ["#111111","#e03131","#f08c00","#2f9e44","#1971c2","#7048e8","#ffffff"];
const sw = $("swatches");
palette.forEach(c => {
  const i = document.createElement("i");
  i.style.background = c;
  if (c === "#ffffff") i.style.borderColor = "#555";
  i.onclick = () => setColor(c);
  sw.appendChild(i);
});
function setColor(c){
  color = c; $("color").value = c;
  [...sw.children].forEach((el, n) => el.classList.toggle("on", palette[n] === c));
  if (tool === "eraser") setTool("pen");
}
function setTool(t){
  tool = t;
  $("bPen").classList.toggle("on", t === "pen");
  $("bEraser").classList.toggle("on", t === "eraser");
}
setColor("#111111");

$("bPen").onclick = () => setTool("pen");
$("bEraser").onclick = () => setTool("eraser");
$("color").oninput = e => setColor(e.target.value);
$("size").oninput = e => { size = +e.target.value; $("sizeV").textContent = size; };

$("bUndo").onclick = () => {
  if (!undoStack.length) return;
  redoStack.push(ctx.getImageData(0, 0, cv.width, cv.height));
  ctx.putImageData(undoStack.pop(), 0, 0);
};
$("bRedo").onclick = () => {
  if (!redoStack.length) return;
  undoStack.push(ctx.getImageData(0, 0, cv.width, cv.height));
  ctx.putImageData(redoStack.pop(), 0, 0);
};
$("bClear").onclick = () => { snapshot(); whiteFill(); };

// 繪圖：座標由 CSS 尺寸換算為畫布內部解析度
function pos(e){
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height };
}
function stroke(a, b){
  ctx.strokeStyle = tool === "eraser" ? "#fff" : color;
  ctx.lineWidth = size * (cv.width / cv.getBoundingClientRect().width);
  ctx.lineCap = ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
}
cv.addEventListener("pointerdown", e => {
  e.preventDefault();
  cv.setPointerCapture(e.pointerId);
  snapshot();
  drawing = true; last = pos(e);
  stroke(last, { x: last.x + 0.01, y: last.y }); // 單點也會畫出圓點
});
cv.addEventListener("pointermove", e => {
  if (!drawing) return;
  e.preventDefault();
  const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of events){ const p = pos(ev); stroke(last, p); last = p; }
});
const end = () => { drawing = false; last = null; };
cv.addEventListener("pointerup", end);
cv.addEventListener("pointercancel", end);

$("ver").textContent = "v" + VERSION;

// 送出
$("send").onclick = async () => {
  const out = $("out"), btn = $("send");
  const dataUrl = cv.toDataURL("image/jpeg", 0.85); // 白底 JPEG，避免透明背景變黑
  btn.disabled = true; btn.textContent = "鑑賞中…";
  out.className = "result"; out.textContent = "";
  try{
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: MODEL,
        stream: false,
        messages: [{
          role: "user",
          content: [
            { type: "text", text: PROMPT },
            { type: "image_url", image_url: { url: dataUrl } }
          ]
        }]
      })
    });
    const raw = await res.text();
    let data; try{ data = JSON.parse(raw) }catch{ data = null }
    if (!res.ok) throw new Error(`HTTP ${res.status}：${(data && (data.error?.message || data.error)) || raw.slice(0, 300)}`);
    const text = data?.choices?.[0]?.message?.content ?? data?.message?.content ?? "";
    const clean = text
      .replace(/<thought>[\s\S]*?<\/thought>/gi, "")
      .replace(/<thought>[\s\S]*$/i, "") // 未閉合的思考區塊
      .trim();
    out.textContent = clean || "（模型沒有回傳文字內容）";
  }catch(err){
    out.className = "result err";
    out.textContent = "失敗：" + err.message;
  }finally{
    btn.disabled = false; btn.textContent = "請鑑賞";
  }
};
</script>
</body>
</html>
